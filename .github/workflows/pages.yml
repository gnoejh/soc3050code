# Publish the lecture decks to GitHub Pages.
#
# The site is rendered from the Slide.md sources on every push rather than
# served from the committed _slides/ directory, so the published decks cannot
# drift from the lesson text the way a checked-in copy would.
#
# WHAT IS PUBLISHED: the ARM edition, and only the ARM edition.
# https://gnoejh.github.io/soc3050code/ is the STM32 course.
#
# The AVR edition was published here until 2026-09-14. It is frozen, it is
# still in the repository under projects2026_avr/, and its committed
# _slides/index.html still opens from a clone - it is simply no longer put
# online. Every root URL it used to answer on (.../18_GLCD_Graphics.html and
# the rest) now 404s; that is the intended consequence of taking it down, not
# an oversight. To bring it back, render projects2026_avr/_build/build-slides.py
# in the build job and copy its _slides/ into a subdirectory of _site.
#
# Only the ARM tree is checked out. A full clone pulls ~856 MB of vendored
# toolchain and simulator that the renderer never reads.
name: Lecture slides

on:
  push:
    branches: [main]
    paths:
      - 'projects2026_arm/**/Slide.md'
      - 'projects2026_arm/_build/build-slides.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue rather than cancel, so the published
# site always corresponds to a commit that was actually rendered.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: projects2026_arm
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The renderer is standard library only, on purpose - see CLAUDE.md
      # section 9. Nothing to install.
      - name: Render the ARM decks
        run: python projects2026_arm/_build/build-slides.py

      # CLAUDE.md section 11: never trust a build's exit code alone on this
      # project. Check the artefact is a real site before publishing it.
      # The expected deck count is DERIVED from the number of Slide.md files,
      # so adding a lesson never needs an edit here.
      - name: Verify the rendered site
        run: |
          set -eu
          out=projects2026_arm/_slides
          test -s "$out/index.html" || { echo "no index.html"; exit 1; }
          lessons=$(find projects2026_arm -mindepth 2 -maxdepth 2 -name Slide.md | wc -l)
          decks=$(find "$out" -maxdepth 1 -name '*.html' | wc -l)
          echo "$lessons lesson(s), $decks HTML file(s)"
          test "$lessons" -gt 0 || { echo "no Slide.md - wrong checkout?"; exit 1; }
          test "$decks" -eq "$((lessons + 1))" || { echo "expected $((lessons + 1)) files, got $decks"; exit 1; }
          grep -q '<title>' "$out/index.html" || { echo "index has no title"; exit 1; }
          # the root must be the ARM index, not a leftover AVR one
          grep -q 'STM32 Lecture Decks' "$out/index.html" \
            || { echo "index is not the ARM edition"; exit 1; }

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -r projects2026_arm/_slides/. _site/
          test -s _site/index.html
          echo "root: $(find _site -maxdepth 1 -name '*.html' | wc -l) file(s)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
