# Publish the lecture decks to GitHub Pages.
#
# The site is rendered from the Slide.md sources on every push rather than
# served from the committed _slides/ directories, so the published decks cannot
# drift from the lesson text the way checked-in copies would.
#
# TWO INDEPENDENT TREES. projects2026_avr/ is the finished 2026 AVR edition and
# is frozen; projects2026_arm/ is the live STM32 edition. Each owns its own
# renderer and neither imports from the other, so each is rendered by its own
# build-slides.py.
#
# LAYOUT. The AVR decks publish at the site root, exactly where they have
# always been, so URLs such as .../00_Introduction.html that students may have
# bookmarked keep working. The ARM decks publish under /arm/.
#
# Only the two lesson trees are checked out. A full clone pulls ~856 MB of
# vendored toolchain and simulator that no renderer reads.
name: Lecture slides

on:
  push:
    branches: [main]
    paths:
      - 'projects2026_avr/**/Slide.md'
      - 'projects2026_avr/_build/build-slides.py'
      - 'projects2026_arm/**/Slide.md'
      - 'projects2026_arm/_build/build-slides.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue rather than cancel, so the published
# site always corresponds to a commit that was actually rendered.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            projects2026_avr
            projects2026_arm
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Both renderers are standard library only, on purpose - see CLAUDE.md
      # section 9. Nothing to install.
      - name: Render the AVR decks
        run: python projects2026_avr/_build/build-slides.py

      - name: Render the ARM decks
        run: python projects2026_arm/_build/build-slides.py

      # CLAUDE.md section 11: never trust a build's exit code alone on this
      # project. Check each artefact is a real site before publishing it.
      # The expected deck count is DERIVED from the number of Slide.md files,
      # so adding a lesson never needs an edit here.
      - name: Verify both rendered sites
        run: |
          set -eu
          for tree in projects2026_avr projects2026_arm; do
            out="$tree/_slides"
            test -s "$out/index.html" || { echo "$tree: no index.html"; exit 1; }
            lessons=$(find "$tree" -mindepth 2 -maxdepth 2 -name Slide.md | wc -l)
            decks=$(find "$out" -maxdepth 1 -name '*.html' | wc -l)
            echo "$tree: $lessons lesson(s), $decks HTML file(s)"
            test "$lessons" -gt 0 || { echo "$tree: no Slide.md - wrong checkout?"; exit 1; }
            test "$decks" -eq "$((lessons + 1))" || { echo "$tree: expected $((lessons + 1)) files, got $decks"; exit 1; }
            grep -q '<title>' "$out/index.html" || { echo "$tree: index has no title"; exit 1; }
          done

      # Assemble one site: AVR at the root, ARM under /arm/.
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -r projects2026_avr/_slides/. _site/
          mkdir -p _site/arm
          cp -r projects2026_arm/_slides/. _site/arm/
          # Add a cross-link to the root index. This edits the STAGED copy
          # only - projects2026_avr/ is frozen and is never modified.
          python - <<'EOF'
          import pathlib
          p = pathlib.Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          link = ('<p style="margin:1rem 0"><a href="arm/index.html">'
                  'SOC3050 ARM edition (STM32) &rarr;</a></p>')
          if "arm/index.html" not in s:
              i = s.find("</h1>")
              j = s.find(">", i) + 1 if i >= 0 else -1
              s = (s[:j] + link + s[j:]) if j > 0 else s.replace("<body>", "<body>" + link, 1)
              p.write_text(s, encoding="utf-8")
              print("cross-link added to the staged root index")
          EOF
          test -s _site/index.html
          test -s _site/arm/index.html
          echo "root: $(find _site -maxdepth 1 -name '*.html' | wc -l) file(s)"
          echo "arm:  $(find _site/arm -maxdepth 1 -name '*.html' | wc -l) file(s)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
